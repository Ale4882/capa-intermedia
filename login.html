<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | NUMERA</title>

    <link rel="stylesheet" href="css/estilos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="auth-header">

        <a href="index.html" class="logo">
            √ <span>NUMERA</span>
        </a>

        <button class="theme-button" id="themeButton" title="Cambiar tema">
                ☾
            </button>

    </header>


    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-symbol">∑</div>

            <h1>Iniciar sesión</h1>

            <p class="auth-subtitle">
                Continúa aprendiendo matemáticas con NUMERA.
            </p>


            <form>

                <div class="form-group">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="ejemplo@correo.com"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresa tu contraseña"
                    >

                </div>


               <a href="estudiante.html" class="auth-submit">
                  Iniciar sesión
             </a>

            </form>


            <p class="auth-switch">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>


            <a href="index.html" class="back-home">
                ← Regresar al inicio
            </a>

        </section>


        <div class="auth-decoration">

            <div class="math-expression">
                f(x) = x² + 2x + 1
            </div>

            <div class="math-symbol symbol-one">π</div>

            <div class="math-symbol symbol-two">∞</div>

            <div class="math-symbol symbol-three">√</div>

            <div class="cat-decoration">
                /\_/\\
                ( o.o )
                > ^ <
            </div>

        </div>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
